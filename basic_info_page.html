<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>基本信息 - Investment</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/basic-info.css">
</head>
<body>

<div class="header">
  <a href="/" class="header-back" title="返回首页">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
  </a>
  <div class="header-icon">📊</div>
  <div class="header-text">
    <h1>基本信息</h1>
    <p>宏观经济数据可视化 · 存贷款利率 / 准备金率 / 货币供应量</p>
  </div>
  <div class="header-status">
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text">检测中...</span>
  </div>
</div>

<div class="main">
  <!-- Time Range Selector -->
  <div class="controls-section">
    <div class="control-group">
      <label for="time-range">查询时间跨度：</label>
      <select id="time-range" class="time-select">
        <option value="1" selected>一年</option>
        <option value="3">三年</option>
        <option value="5">五年</option>
        <option value="10">十年</option>
      </select>
      <button id="refresh-btn" class="refresh-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 4v6h-6M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
        </svg>
        刷新数据
      </button>
      <button class="debug-btn" onclick="toggleDebug()">
        🐛 调试
      </button>
    </div>
    <div class="loading-indicator" id="loading-indicator">
      <div class="spinner"></div>
      <span>加载中...</span>
    </div>
  </div>

  <!-- Charts Grid -->
  <div class="charts-grid">
    
    <!-- Deposit Rate Chart -->
    <div class="chart-card">
      <div class="chart-header">
        <h3 class="chart-title">
          <span class="chart-icon">💰</span>
          存款利率
        </h3>
        <span class="chart-badge">Deposit Rate</span>
      </div>
      <div class="chart-container">
        <canvas id="deposit-rate-chart"></canvas>
      </div>
      <div class="chart-footer" id="deposit-rate-footer">
        <span class="data-count">数据点: --</span>
        <span class="data-range">时间范围: --</span>
      </div>
    </div>

    <!-- Loan Rate Chart -->
    <div class="chart-card">
      <div class="chart-header">
        <h3 class="chart-title">
          <span class="chart-icon">🏦</span>
          贷款利率
        </h3>
        <span class="chart-badge">Loan Rate</span>
      </div>
      <div class="chart-container">
        <canvas id="loan-rate-chart"></canvas>
      </div>
      <div class="chart-footer" id="loan-rate-footer">
        <span class="data-count">数据点: --</span>
        <span class="data-range">时间范围: --</span>
      </div>
    </div>

    <!-- Required Reserve Ratio Chart -->
    <div class="chart-card">
      <div class="chart-header">
        <h3 class="chart-title">
          <span class="chart-icon">🏛️</span>
          存款准备金率
        </h3>
        <span class="chart-badge">Reserve Ratio</span>
      </div>
      <div class="chart-container">
        <canvas id="reserve-ratio-chart"></canvas>
      </div>
      <div class="chart-footer" id="reserve-ratio-footer">
        <span class="data-count">数据点: --</span>
        <span class="data-range">时间范围: --</span>
      </div>
    </div>

    <!-- Money Supply Month Chart -->
    <div class="chart-card">
      <div class="chart-header">
        <h3 class="chart-title">
          <span class="chart-icon">📈</span>
          货币供应量（月度同比）
        </h3>
        <span class="chart-badge">Money Supply YoY</span>
      </div>
      <div class="chart-container">
        <canvas id="money-supply-month-chart"></canvas>
      </div>
      <div class="chart-footer" id="money-supply-month-footer">
        <span class="data-count">数据点: --</span>
        <span class="data-range">时间范围: --</span>
      </div>
    </div>

  </div>
</div>

<div class="footer">
  <span>Investment System · 宏观经济数据</span>
  <a href="/">首页</a>
  <a href="/strategy">策略分析</a>
  <a href="/docs">API 文档</a>
  <a href="http://baostock.com" target="_blank">BaoStock 官网</a>
</div>

<!-- Debug Drawer -->
<div class="drawer-overlay" id="debug-drawer-overlay" onclick="closeDebugDrawer()"></div>
<div class="drawer" id="debug-drawer">
  <div class="drawer-header">
    <span class="drawer-title">🐛 调试日志</span>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="drawer-btn" onclick="clearDebug()">清空</button>
      <button class="drawer-close" onclick="closeDebugDrawer()">✕</button>
    </div>
  </div>
  <div id="debug-log" class="debug-log"></div>
</div>

<script type="module" src="/js/basic-info/main.js"></script>
</body>
</html>
